<svg width="500" height="100" viewBox="0 0 500 100" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400..700;1,400..700&amp;display=swap');

      @keyframes animBox {
        from { transform: translateX(0px); }
        to { transform: translateX(460px); }
      }

      .border-bar {
        fill: #9e9e9e;
      }

      .fg-bar {
        fill: #e0e0e0;
        transform-box: fill-box;
        will-change: transform;
        animation: animBox 0.5s ease infinite alternate;
      }

      .title, .title2 {
        font-family: 'Lora', 'Segoe UI', sans-serif;
        font-size: 25px;
        pointer-events: none;
        transition: fill 0.3s ease;
      }

      .title {
        fill: #000000;
      }

      .title2 {
        fill: rgba(0, 0, 0, 0);
      }

      .card-container {
        cursor: pointer;
        user-select: none;
      }

    </style>
  </defs>

  <!-- Vector Elements -->
  <g class="card-container" id="stats-card">
    <rect x="0" y="30" width="40" height="40" class="fg-bar" />
  </g>
</svg>
