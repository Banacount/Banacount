<svg width="495" height="195" viewBox="0 0 495 195" xmlns="http://www.w3.org/2000/svg">
  
  <!-- Embedded CSS Styles & Animations -->
  <style>
  </style>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400..700;1,400..700&amp;display=swap');

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    
    .border-bar {
      fill: #9e9e9e;
    }
    .fg-bar {
      fill: #e0e0e0;
      transition: transform 0.5s ease;
    }
    
    .title {
      font-family: 'Lora', 'Segoe UI', sans-serif;
      fill: #000;
      font-size: 25px;
    }
    .title2 {
      font-family: 'Lora', 'Segoe UI', sans-serif;
      fill: transparent;
      font-size: 25px;
    }

    .card-container {
      cursor: pointer;
      user-select: none;
    }

    .card-container:hover .title {
      fill: transparent;
    }
    .card-container:hover .title2 {
      fill: #000;
    }
    .card-container:hover .fg-bar {
      transform: translate(-6px, -6px);
    }
  </style>

  <!-- Vector Elements -->
  <g class="card-container" id="stats-card">
    <rect x="0" y="0" width="500" height="100" class="border-bar" />
    <rect x="6" y="6" width="485" height="88" class="fg-bar" />
    <text x="30" y="62" class="title">Hover for a hot petite femboy!</text>
    <text x="30" y="62" class="title2">Ayo Pause..</text>
  </g>

</svg>
