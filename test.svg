<svg width="500" height="100" viewBox="0 0 500 100" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400..700;1,400..700&amp;display=swap');

      @keyframes animBox {
        from { transform: translateX(0px); }
        to { transform: translateX(460px); }
      }

      .bar {
        fill: #e0e0e0;
        transform-box: fill-box;
        will-change: transform;
      }

      .title {
        font-family: 'Lora', 'Segoe UI', sans-serif;
        fill: #fff;
        font-size: 10px;
      }

      .anim1 { animation: animBox 0.5s linear infinite alternate; }
      .anim2 { animation: animBox 0.6s linear infinite alternate; }
      .anim3 { animation: animBox 0.7s linear infinite alternate; }
      .anim4 { animation: animBox 0.8s linear infinite alternate; }
      .anim5 { animation: animBox 0.9s linear infinite alternate; }

      .card-container {
        cursor: pointer;
        user-select: none;
      }

    </style>
  </defs>

  <!-- Vector Elements -->
  <g class="card-container" id="stats-card">
    <rect x="0" y="30" width="40" height="40" class="bar anim1" />
    <rect x="0" y="30" width="40" height="40" class="bar anim2" />
    <rect x="0" y="30" width="40" height="40" class="bar anim3" />
    <rect x="0" y="30" width="40" height="40" class="bar anim4" />
    <rect x="0" y="30" width="40" height="40" class="bar anim5" />
    <text x="20" y="90" class="title">Random or Keyframe? lmao</text>
  </g>
</svg>
