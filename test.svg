<svg width="500" height="100" viewBox="0 0 500 100" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400..700;1,400..700&amp;display=swap');

      .border-bar {
        fill: #9e9e9e;
      }

      .fg-bar {
        fill: #e0e0e0;
        transition: transform 0.3s ease;
        transform-box: fill-box;
      }

      .title, .title2 {
        font-family: 'Lora', 'Segoe UI', sans-serif;
        font-size: 25px;
        pointer-events: none;
        transition: fill 0.3s ease;
      }

      .title {
        fill: #000000;
      }

      .title2 {
        fill: rgba(0, 0, 0, 0);
      }

      .card-container {
        cursor: pointer;
        user-select: none;
      }

      /* Hover triggers */
      .card-container:hover .title {
        fill: rgba(0, 0, 0, 0);
      }

      .card-container:hover .title2 {
        fill: #000000;
      }

      .card-container:hover .fg-bar {
        transform: translate(-6px, -6px);
      }
    </style>
  </defs>

  <!-- Vector Elements -->
  <g class="card-container" id="stats-card">
    <rect x="0" y="0" width="500" height="100" class="border-bar" />
    <rect x="6" y="6" width="488" height="88" class="fg-bar" />
    <text x="30" y="58" class="title">Hover for a hot petite femboy!</text>
    <text x="30" y="58" class="title2">Ayo Pause..</text>
  </g>
</svg>
