<svg width="300" height="300" viewBox="0 0 300 300" fill="none" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">

<style>
@font-face {
  font-family: 'Fira Sans';
  font-style: normal;
  font-weight: 400;
  font-display: fallback;
  src: url(data:font/truetype;base64,) format('truetype');
}

@keyframes logo_rotate {
	0% { 
		transform: perspective(400px) rotateY(0deg) translateY(0px); 
	}
	50% { 
		transform: perspective(400px) rotateY(180deg) translateY(30px); 
	}
	100% { 
		transform: perspective(400px) rotateY(360deg) translateY(0px); 
	}
}

@keyframes rect_scale {
	0% { 
		transform: scaleX(1); 
	}
	50% {
		transform: scaleX(1.2); 
	}
	100% { 
		transform: scaleX(1); 
	}
}

.logo-image {
	transform-origin: center;
	animation: logo_rotate 5s linear infinite;
}
.rect_holder {
	transform-origin: center;
	animation: rect_scale 5s ease infinite;
}

</style>

<rect x="25" y="10" width="250" height="250" class="logo-image" fill="url(#pattern0_6_2)"/>
<rect x="50" y="290" width="200" height="10" class="rect_holder" fill="#0051FF"/>

<text x="150" y="280" text-anchor="middle" font-family='"Fira Sans", monospace' fill="#0051FF" font-size="20">
mysql
</text>

<defs>
<pattern id="pattern0_6_2" patternContentUnits="objectBoundingBox" width="1" height="1">
<use xlink:href="#image0_6_2" transform="scale(0.0025)"/>
</pattern>
<image id="image0_6_2" width="400" height="400" preserveAspectRatio="none" href="./mysql.png"/>
</defs>

</svg>


